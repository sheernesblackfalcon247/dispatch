<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Black Falcon 247 Taxi</title>
    <style>
      * { margin: 0; box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #fffbeb 0%, #ffffff 60%);
        color: #14141b;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 360px; }
      .badge {
        width: 72px; height: 72px; border-radius: 20px;
        background: #f5b301; display: flex; align-items: center; justify-content: center;
        margin: 0 auto 20px; box-shadow: 0 10px 30px rgba(245,179,1,0.35);
      }
      h1 { font-size: 22px; font-weight: 800; }
      p { margin-top: 8px; color: #6b7280; font-size: 15px; line-height: 1.5; }
      button {
        margin-top: 22px; border: 0; cursor: pointer;
        background: #f5b301; color: #fff; font-weight: 700; font-size: 15px;
        padding: 12px 22px; border-radius: 12px;
      }
      button:hover { background: #d99700; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2" />
          <circle cx="7" cy="17" r="2" />
          <path d="M9 17h6" />
          <circle cx="17" cy="17" r="2" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>Black Falcon 247 Taxi needs an internet connection for live bookings. Please check your connection and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
